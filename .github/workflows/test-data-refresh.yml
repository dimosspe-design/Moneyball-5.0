name: Moneyball 5.0 - Test Data Refresh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest EuroLeague data
        run: |
          curl --fail --location --retry 3 \
            --connect-timeout 15 \
            --max-time 120 \
            --output latest-euroleague.zip \
            https://675hoops.com/downloads/euroleague-2026.zip

      - name: Validate and compare datasets
        shell: python
        run: |
          import csv
          import gzip
          import io
          import zipfile
          from pathlib import Path

          def inspect(path):
              with zipfile.ZipFile(path) as archive:
                  names = archive.namelist()
                  required = {
                      "games-2026.csv.gz",
                      "team_games-2026.csv.gz",
                      "player_box-2026.csv.gz",
                      "shots-2026.csv.gz",
                  }

                  missing = required - set(names)
                  if missing:
                      raise ValueError(
                          f"Missing datasets: {sorted(missing)}"
                      )

                  counts = {}
                  for name in sorted(required):
                      content = archive.read(name)
                      decompressed = gzip.decompress(content)
                      reader = csv.DictReader(
                          io.StringIO(decompressed.decode("utf-8-sig"))
                      )
                      counts[name] = sum(1 for _ in reader)

                  return counts

          latest = inspect("latest-euroleague.zip")

          print("LATEST DATA:")
          for name, count in latest.items():
              print(f"{name}: {count}")

          existing = Path("euroleague.zip")

          if existing.exists():
              previous = inspect(existing)

              print("\nEXISTING DATA:")
              for name, count in previous.items():
                  print(f"{name}: {count}")

              old_games = previous["games-2026.csv.gz"]
              new_games = latest["games-2026.csv.gz"]

              print(f"\nPrevious games: {old_games}")
              print(f"Latest games: {new_games}")

              if new_games > old_games:
                  print("RESULT: NEW GAMES AVAILABLE")
              elif new_games == old_games:
                  print("RESULT: NO NEW GAMES")
              else:
                  raise ValueError(
                      "Downloaded data contains fewer games "
                      "than the existing dataset."
                  )
          else:
              print("\nNo existing ZIP found.")
              print("RESULT: DOWNLOAD AND VALIDATION SUCCESSFUL")

      - name: Upload test dataset
        uses: actions/upload-artifact@v4
        with:
          name: latest-euroleague-test
          path: latest-euroleague.zip
          retention-days: 7
