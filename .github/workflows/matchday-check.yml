name: Moneyball 5.0 - Matchday Schedule Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-matchday:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check upcoming Fantasy deadline
        run: |
          python matchday_schedule.py \
            --schedule schedule.csv \
            --hours-before 24 \
            --out results/matchday_status.json

      - name: Upload matchday status
        uses: actions/upload-artifact@v4
        with:
          name: matchday-status
          path: results/matchday_status.json
          if-no-files-found: error
