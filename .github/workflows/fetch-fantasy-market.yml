name: Moneyball 5.0 - Fetch Fantasy Market

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-market:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install requests beautifulsoup4

      - name: Fetch public Fantasy market
        run: |
          python fetch_fantasy_market.py

      - name: Validate players and coaches
        run: |
          python - <<'PY'
          import csv
          import json
          import math
          from pathlib import Path

          results = Path("results")

          players_path = results / "public_market_snapshot.csv"
          coaches_path = results / "public_coaches_snapshot.csv"
          report_path = results / "public_market_report.json"

          def read_csv(path):
              assert path.exists(), f"Missing file: {path}"
              with path.open(newline="", encoding="utf-8-sig") as f:
                  return list(csv.DictReader(f))

          players = read_csv(players_path)
          coaches = read_csv(coaches_path)

          assert report_path.exists(), "Market report missing"
          report = json.loads(report_path.read_text(encoding="utf-8"))

          assert players, "No players extracted"
          assert coaches, "No coaches extracted"

          assert len(players) == report["players_extracted"]
          assert len(coaches) == report["coaches_extracted"]

          assert all(
              row["position"] in {"G", "F", "C"}
              for row in players
          ), "Invalid player position"

          assert all(
              row["position"] == "HC"
              for row in coaches
          ), "Invalid coach position"

          for row in players + coaches:
              price = float(row["credit"])
              assert math.isfinite(price) and price > 0, (
                  f"Invalid price: {row['player']}"
              )

          keys = [
              (row["player"].strip().casefold(),
               row["team"].strip().casefold())
              for row in players + coaches
          ]

          assert len(keys) == len(set(keys)), (
              "Duplicate market entries"
          )

          print("Players extracted:", len(players))
          print("Coaches extracted:", len(coaches))
          print("Extraction issues:", len(report["issues"]))
          print(
              "Official market verified:",
              report["official_fantasy_market_verified"]
          )
          print(
              "Coach projections available:",
              report["coach_projections_available"]
          )

          print("SUCCESS: Player and coach market validated")
          print("NO TRANSFERS EXECUTED")
          PY

      - name: Upload market snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneyball-public-market-with-coaches
          path: |
            results/public_market_snapshot.csv
            results/public_coaches_snapshot.csv
            results/public_market_report.json
          retention-days: 14
          if-no-files-found: warn
