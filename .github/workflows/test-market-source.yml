name: Moneyball 5.0 - Test Market Source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install diagnostic dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Check Fantasy market source
        run: python check_market_source.py

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneyball-market-source-diagnostic
          path: results/market_source_diagnostic.json
          retention-days: 14
          if-no-files-found: warn
